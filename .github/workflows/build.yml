# Builds the Chinese edition on Windows on every push: the tests first, then vorax-overlay.exe, packed with its
# start files and licences as a zip to download from the run's page (Actions → the run → Artifacts). A version
# tag (v0.2.2-zh.1 and so on, or a release made on GitHub's page with a new tag) also puts that zip on the
# release, with its SHA-256.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  # write: a tag's run creates its release
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup default stable

      - uses: Swatinem/rust-cache@v2

      # a release's exe knows its version (the tag's), and is offered only newer releases
      - name: Version (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "VORAX_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tests
        env:
          # the tests don't need the release build's link-time optimisation; it only makes them slower to build
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo test --release --workspace

      - name: Build vorax-overlay.exe
        run: cargo build --release -p vorax-overlay

      - name: Pack
        shell: pwsh
        run: |
          $d = "vorax-zh"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target\release\vorax-overlay.exe $d
          Copy-Item start-zh.bat, start-zh-debug.bat $d
          Copy-Item LICENSE "$d\LICENSE.txt"
          Copy-Item data\fonts\OFL.txt "$d\FONT-LICENSE.txt"
          # the Chinese guide (the only .txt at the top), under an ASCII name as make-share.bat does
          Get-ChildItem -File -Filter *.txt | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName "$d\README-zh.txt" }
          Get-ChildItem $d

      - uses: actions/upload-artifact@v4
        with:
          name: vorax-zh-${{ github.sha }}
          path: vorax-zh/
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "vorax-zh-$tag.zip"
          Compress-Archive -Path vorax-zh\* -DestinationPath $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash vorax-zh\vorax-overlay.exe -Algorithm SHA256).Hash.ToLower()
          # this version's lines from CHANGELOG-zh.md first: the tray's update card shows them
          $what = @()
          $in = $false
          foreach ($line in (Get-Content CHANGELOG-zh.md -Encoding utf8)) {
            if ($line -match '^## ') { $in = ($line.Trim() -eq "## $tag"); continue }
            if ($in -and $line.Trim() -ne '') { $what += $line }
          }
          $whatText = ($what -join "`n")
          $notes = @"
          $whatText

          火炬之光：無限「渴癮症」輔助器中文版（非官方）。下載下方的 $zip，解壓縮後依照 README-zh.txt 使用。
          更新內容與兩種模式的比較請看專案首頁的 README。

          第一次執行時 Windows 可能顯示「Windows 已保護您的電腦」（程式沒有數位簽章），請點「其他資訊」→「仍要執行」。

          SHA-256
          - ${zip}: $zipHash
          - vorax-overlay.exe: $exeHash
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          # a release made on the web page (its tag made with it) gets the zip and the notes; a tag pushed alone
          # gets a release of its own
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip vorax-zh\vorax-overlay.exe --clobber
            gh release edit $tag --notes-file notes.md
          } else {
            gh release create $tag $zip vorax-zh\vorax-overlay.exe --title "$tag" --notes-file notes.md
          }
          exit $LASTEXITCODE
