# Builds SmartTorch on Windows on every push: the tests first, then SmartTorch.exe (the vorax-overlay crate's
# program), packed with its guide and licences as a zip to download from the run's page (Actions → the run →
# Artifacts). A version tag (v1.0.0 and so on, or a release made on GitHub's page with a new tag) also puts the
# zip and the exe on the release, with their SHA-256. The exe goes up twice: as SmartTorch.exe, and as
# vorax-overlay.exe for the Chinese edition's versions before SmartTorch (v0.2.2-zh.N), whose updater asks for that
# name.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  # write: a tag's run creates its release
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup default stable

      - uses: Swatinem/rust-cache@v2

      # a release's exe knows its version (the tag's), and is offered only newer releases
      - name: Version (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "VORAX_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tests
        env:
          # the tests don't need the release build's link-time optimisation; it only makes them slower to build
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo test --release --workspace

      - name: Build SmartTorch.exe
        run: cargo build --release -p vorax-overlay

      - name: Pack
        shell: pwsh
        run: |
          $d = "SmartTorch"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target\release\vorax-overlay.exe "$d\SmartTorch.exe"
          Copy-Item README.txt $d
          Copy-Item LICENSE "$d\LICENSE.txt"
          Copy-Item data\fonts\OFL.txt "$d\FONT-LICENSE.txt"
          Get-ChildItem $d

      - uses: actions/upload-artifact@v4
        with:
          name: SmartTorch-${{ github.sha }}
          path: SmartTorch/
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "SmartTorch-$tag.zip"
          Compress-Archive -Path SmartTorch\* -DestinationPath $zip
          # the same program under the name the Chinese edition's updater asks for
          Copy-Item SmartTorch\SmartTorch.exe vorax-overlay.exe
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash SmartTorch\SmartTorch.exe -Algorithm SHA256).Hash.ToLower()
          # this version's lines from CHANGELOG.md first: the update note shows them
          $what = @()
          $in = $false
          foreach ($line in (Get-Content CHANGELOG.md -Encoding utf8)) {
            if ($line -match '^## ') { $in = ($line.Trim() -eq "## $tag"); continue }
            if ($in -and $line.Trim() -ne '') { $what += $line }
          }
          $whatText = ($what -join "`n")
          $notes = @"
          $whatText

          SmartTorch：火炬之光：無限 的免費輔助工具箱（非官方）。下載下方的 $zip，解壓縮後點兩下 SmartTorch.exe。
          SmartTorch, a free helper toolbox for Torchlight: Infinite (unofficial). Download $zip below, unpack it and run SmartTorch.exe.

          完全免費，官方下載只有這裡。Free: this is the only official download.

          第一次執行時 Windows 可能顯示「Windows 已保護您的電腦」（程式沒有數位簽章），請點「其他資訊」→「仍要執行」。
          The first time, Windows may show "Windows protected your PC" (the program isn't code-signed): click More info → Run anyway.

          SHA-256
          - ${zip}: $zipHash
          - SmartTorch.exe, vorax-overlay.exe: $exeHash
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          # a release made on the web page (its tag made with it) gets the zip and the notes; a tag pushed alone
          # gets a release of its own
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip SmartTorch\SmartTorch.exe vorax-overlay.exe --clobber
            # a title left empty on the web page shows the last commit's message: the version instead
            $title = gh release view $tag --json name -q .name
            if ([string]::IsNullOrWhiteSpace($title)) {
              gh release edit $tag --notes-file notes.md --title "$tag"
            } else {
              gh release edit $tag --notes-file notes.md
            }
          } else {
            gh release create $tag $zip SmartTorch\SmartTorch.exe vorax-overlay.exe --title "$tag" --notes-file notes.md
          }
          exit $LASTEXITCODE
