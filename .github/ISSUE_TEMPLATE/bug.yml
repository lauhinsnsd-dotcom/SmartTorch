name: 問題回報
description: 讀錯畫面、建議怪怪的、程式出錯
title: "[問題] "
body:
  - type: markdown
    attributes:
      value: |
        感謝回報！最有用的是火炬工具箱做好的回報檔：
        1. 遊戲中讀錯時按 **Ctrl + Alt + B** 記下那個畫面（可以記好幾個）。
        2. 打完後在工具箱「渴癮症助手」頁按 **回報問題**，桌面會出現「火炬工具箱回報-日期.zip」。
        3. 把這個 zip 拖到下面「回報檔」欄位。
  - type: textarea
    id: what
    attributes:
      label: 發生了什麼
      description: 例如「第 3 格讀成 4x474，遊戲是 1x171」、「有刷新次數卻沒有建議刷新」。可以直接貼截圖。
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: 大約什麼時候、第幾回合
      placeholder: 例如：今天 20:15 那一局，第 4 回合
  - type: dropdown
    id: resolution
    attributes:
      label: 遊戲解析度
      options:
        - 2560×1440
        - 3840×2160
        - 1920×1080
        - 其他（請在下面說明）
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 遊戲客戶端
      options:
        - 繁體中文
        - 簡體中文
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 渴癮症助手的模式
      options:
        - 原作者
        - 衝分
  - type: textarea
    id: files
    attributes:
      label: 回報檔
      description: |
        把桌面的「火炬工具箱回報-日期.zip」拖曳到這裡（裡面有記下的畫面、記錄檔與版本）。
    validations:
      required: true
