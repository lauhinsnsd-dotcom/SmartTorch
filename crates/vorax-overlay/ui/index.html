<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>火炬工具箱</title>
<style>
:root {
  --bg: #14161b; --side: #171920; --card: #1d2027; --card2: #23262e; --line: #2b2f38; --line2: #3a3f4a;
  --text: #ece9e2; --soft: #c9ccd3; --mute: #a3a7b0; --gold: #e3b25a; --gold2: #f3cd85; --goldbg: #3a3020;
  --green: #6fd39b; --greenbg: #1f3a2b; --green2: #8fe3b2; --red: #e86a5a; --grey: #5a5f6a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: "Microsoft JhengHei UI", "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif; font-size: 15px; user-select: none; }
body.sc { font-family: "Microsoft YaHei UI", "Microsoft JhengHei UI", "Segoe UI", system-ui, sans-serif; }
button { font-family: inherit; font-size: 15px; color: inherit; cursor: pointer; }
a { color: var(--gold); } a:hover { color: var(--gold2); }
.app { display: flex; height: 100%; }
nav { width: 240px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand b { font-size: 18px; display: block; }
.brand small { font-size: 12px; color: var(--mute); }
.navs { display: flex; flex-direction: column; gap: 4px; }
.nav { min-height: 46px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; border-radius: 8px; border: none; background: transparent; color: var(--soft); text-align: left; }
.nav:hover { background: #20232b; }
.nav.on { background: #2a2d36; color: var(--gold2); font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.g { background: var(--green); } .y { background: var(--gold); } .r { background: var(--red); } .n { background: var(--grey); }
.navfoot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 0 6px; }
.seg { display: flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; align-self: flex-start; }
.seg button { min-height: 36px; padding: 0 14px; border: none; background: transparent; color: var(--soft); font-size: 14px; }
.seg button.on { background: var(--goldbg); color: var(--gold2); font-weight: 700; }
main { flex: 1; min-width: 0; overflow-y: auto; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-size: 26px; }
h2 { margin: 0; font-size: 16px; color: var(--gold2); }
.sub { font-size: 14px; color: var(--mute); margin-top: 4px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { font-size: 13px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.badge.run { background: var(--greenbg); color: var(--green2); } .badge.stop { background: #2a2d36; color: #b4b8c0; }
.btn { min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; color: var(--text); font-size: 14px; }
.btn:hover { border-color: #565c69; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.big { min-height: 44px; padding: 0 20px; font-size: 15px; font-weight: 700; }
.btn.gold { border: none; background: var(--gold); color: #1a1408; font-weight: 700; }
.btn.goldline { border-color: var(--gold); background: var(--goldbg); color: var(--gold2); font-weight: 700; }
.btn.small { min-height: 34px; padding: 0 12px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.stat b { font-size: 24px; display: block; } .stat b.gold { color: var(--gold); }
.stat span { font-size: 13px; color: var(--mute); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.grid3 { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 12px; align-items: center; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 96px minmax(0, 1fr); column-gap: 12px; row-gap: 12px; font-size: 14px; }
.k { color: var(--mute); }
.v { display: flex; align-items: center; gap: 8px; min-width: 0; }
.path { font-size: 12px; color: var(--mute); margin-top: 4px; overflow-wrap: anywhere; user-select: text; }
.tip { background: var(--card2); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--soft); line-height: 1.8; }
.tip b { color: var(--gold2); }
.link { border: none; background: none; padding: 0; color: var(--gold); font-size: inherit; text-decoration: underline; }
.label { font-size: 13px; color: var(--mute); margin-bottom: 8px; }
.pill { min-height: 40px; min-width: 40px; padding: 0 14px; border-radius: 8px; font-size: 14px; border: 1px solid var(--line2); background: transparent; color: var(--soft); }
.pill.on { border-color: var(--gold); background: var(--goldbg); color: var(--gold2); font-weight: 700; }
.sw { width: 48px; height: 28px; border-radius: 999px; border: none; padding: 3px; display: flex; flex-shrink: 0; justify-content: flex-start; background: var(--line2); }
.sw.on { justify-content: flex-end; background: var(--gold); }
.sw i { width: 22px; height: 22px; border-radius: 50%; background: var(--bg); display: block; }
.swrow { display: flex; align-items: center; gap: 12px; font-size: 14px; flex-wrap: wrap; }
.note { color: var(--mute); font-size: 13px; }
.keys { display: grid; grid-template-columns: 140px minmax(0, 1fr); row-gap: 6px; font-size: 13px; color: var(--soft); border-top: 1px solid var(--line); padding-top: 14px; }
.keys .kk { color: var(--text); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.tab { min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--soft); font-size: 14px; }
.tab.on { border-color: var(--gold); background: var(--goldbg); color: var(--gold2); font-weight: 700; }
.step { display: flex; gap: 14px; }
.num { width: 30px; height: 30px; border-radius: 50%; background: var(--goldbg); color: var(--gold2); font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step b { font-size: 15px; } .step p { margin: 4px 0 0; font-size: 14px; color: var(--soft); line-height: 1.7; }
.problem { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; }
.problem b { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.problem p { margin: 0; font-size: 14px; color: var(--soft); line-height: 1.7; }
.para { font-size: 14px; color: var(--soft); line-height: 1.7; margin: 0; }
.sep { border-top: 1px solid var(--line); padding-top: 16px; }
.notes { white-space: pre-wrap; font-size: 13px; color: var(--soft); line-height: 1.7; background: var(--card2); border-radius: 10px; padding: 12px 14px; max-height: 260px; overflow-y: auto; user-select: text; }
.bar { height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); }
.newdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block; }
@media (max-width: 760px) { nav { width: 190px; } main { padding: 24px; } }
</style>
</head>
<body>
<div class="app">
  <nav aria-label="主選單">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e3b25a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-7.5z"/></svg>
      <div><b>火炬工具箱</b><small>by FakerPlay</small></div>
    </div>
    <div class="navs" id="navs"></div>
    <div class="navfoot" id="navfoot"></div>
  </nav>
  <main id="main"></main>
</div>
<script>
"use strict";
// Traditional → Simplified, character by character (OpenCC, made by dev/make_ui_t2s.py), after the words that
// Simplified writes differently
const T2S = /*T2S*/{};
const PHRASES = [
  ["解析度", "分辨率"], ["視窗", "窗口"], ["設定", "设置"], ["資料夾", "文件夹"], ["檔案", "文件"], ["記錄檔", "日志文件"],
  ["預設", "默认"], ["螢幕", "屏幕"], ["回報", "反馈"], ["程式", "程序"], ["支援", "支持"], ["連結", "链接"], ["資訊", "信息"],
  ["工作列", "任务栏"], ["圖示", "图标"], ["滑鼠", "鼠标"], ["文字辨識", "文字识别"], ["全螢幕", "全屏"], ["獨佔", "独占"], ["下載", "下载"]
];
function toSc(t) {
  for (const [a, b] of PHRASES) t = t.split(a).join(b);
  let out = "";
  for (const c of t) out += T2S[c] || c;
  return out;
}

let S = null;           // the state, from the toolbox
let page = "vorax";     // vorax | tartarus | settings
let tab = "general";    // the settings' tab
const send = (o) => window.chrome && window.chrome.webview && window.chrome.webview.postMessage(o);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sw = (on, cmd, key, label) => `<button class="sw ${on ? "on" : ""}" aria-pressed="${on}" aria-label="${esc(label)}" data-cmd="${cmd}" data-key="${key}" data-value="${!on}"><i></i></button>`;
const dot = (c) => `<span class="dot ${c}"></span>`;

function nav() {
  const v = S ? S.vorax : null;
  const items = [
    ["vorax", "渴癮症助手", v ? (v.running ? "g" : "n") : ""],
    ["tartarus", "囚獸助手", S && S.tartarus && S.tartarus.installed ? (S.tartarus.running ? "g" : "n") : ""],
    ["settings", "設定", S && S.update ? "newdot" : ""],
  ];
  document.getElementById("navs").innerHTML = items.map(([id, label, d]) =>
    `<button class="nav ${page === id ? "on" : ""}" data-page="${id}" aria-current="${page === id ? "page" : "false"}"><span>${label}</span>${d === "newdot" ? '<span class="newdot" title="有新版本"></span>' : d ? dot(d) : ""}</button>`).join("");
  const game = v && v.game.open;
  const sc = S && S.script === "sc";
  document.getElementById("navfoot").innerHTML =
    `<div class="row" style="font-size:13px;color:var(--soft);gap:8px">${dot(game ? "g" : "n")}${game ? "遊戲已開啟" : "遊戲未開啟"}</div>
     <div class="seg" role="group" aria-label="介面文字" data-noconv>
       <button class="${sc ? "" : "on"}" aria-pressed="${!sc}" data-cmd="set" data-key="script" data-value="tc">繁體</button>
       <button class="${sc ? "on" : ""}" aria-pressed="${sc}" data-cmd="set" data-key="script" data-value="sc">简体</button>
     </div>`;
}

function ago(s) {
  if (s < 60) return `${s} 秒前`;
  if (s < 3600) return `${Math.floor(s / 60)} 分鐘前`;
  return `${Math.floor(s / 3600)} 小時前`;
}

function ocrName(l) {
  if (/^zh-(Hant|TW|HK|MO)/i.test(l)) return "中文（繁體）";
  if (/^zh/i.test(l)) return "中文（簡體）";
  if (/^en/i.test(l)) return "英文";
  return l;
}

function vorax() {
  const v = S.vorax;
  const supported = (w, h) => (w === 2560 && h === 1440) || (w === 3840 && h === 2160);
  let gameRow;
  if (!v.game.open) gameRow = `${dot("n")}未開啟遊戲`;
  else if (v.game.fullScreen) gameRow = `${dot("r")}遊戲是獨佔全螢幕：請改為無邊框或視窗 <button class="link" data-goto="help">怎麼做</button>`;
  else if (v.game.w && !supported(v.game.w, v.game.h)) gameRow = `${dot("y")}已連接（${v.game.w}×${v.game.h}）：此解析度未測試，可能讀不準`;
  else gameRow = `${dot("g")}已連接${v.game.w ? `（${v.game.w}×${v.game.h}）` : ""}`;
  const L = v.log;
  const logText = {
    on: [dot("g"), "已開啟"], checking: [dot("y"), "檢查中…"], nogame: [dot("n"), "等待遊戲開啟"],
    off: [dot("r"), "遊戲沒有寫入日誌：請在遊戲中開啟日誌"], missing: [dot("r"), "找不到遊戲日誌"],
  }[L.state] || [dot("n"), "—"];
  const how = L.path ? (L.manual ? "（手動選擇）" : "（自動找到）") : "";
  const fix = (L.state === "off" || L.state === "missing") ? ` <button class="link" data-goto="help">怎麼辦</button>` : "";
  const ocr = v.ocr === null ? `${dot("n")}檢查中…` : v.ocr === false ? `${dot("r")}未安裝：只能用卡面圖案辨認` : `${dot("g")}${ocrName(v.ocr)}已安裝`;
  const last = v.last ? `${dot(v.last.warn ? "y" : "g")}${esc(v.last.text)}（${ago(v.last.ago)}）` : `${dot("n")}尚未讀取`;
  const st = v.stats;
  const modeName = v.mode === "mean" ? "衝分" : "原作者";
  return `
  <div class="head">
    <div><h1>渴癮症助手</h1><div class="sub">手術準備：建議下一步，培養槽下方標示讀取結果</div></div>
    <div class="row"><span class="badge ${v.running ? "run" : "stop"}">${v.running ? "執行中" : "已停止"}</span>
      <button class="btn big ${v.running ? "" : "gold"}" data-cmd="vorax" data-on="${!v.running}">${v.running ? "停止" : "啟動"}</button></div>
  </div>
  <div class="stats">
    <div class="stat"><b>${st.games}</b><span>打完的局（${modeName}）</span></div>
    <div class="stat"><b class="gold">${st.rainbow}</b><span>彩箱局數</span></div>
    <div class="stat"><b>${st.games ? st.mean.toFixed(1) + " 萬" : "—"}</b><span>平均分數</span></div>
  </div>
  <section class="card" aria-label="連接狀態">
    <h2>連接狀態</h2>
    <div class="grid3">
      <div class="k">遊戲視窗</div><div class="v">${gameRow}</div><div></div>
      <div class="k">遊戲日誌</div>
      <div style="min-width:0"><div class="v">${logText[0]}${logText[1]}${how}${fix}</div>${L.path ? `<div class="path">${esc(L.path)}</div>` : ""}</div>
      <div class="row" style="gap:6px"><button class="btn small" data-cmd="chooseLog">選擇…</button><button class="btn small" data-cmd="autoLog">自動</button></div>
      <div class="k">文字辨識</div><div class="v">${ocr}</div><div></div>
      <div class="k">最後讀取</div><div class="v">${last}</div><div></div>
    </div>
    <div class="tip"><b>讀不到或讀錯？</b> ① 按 Ctrl + Alt + X 重新讀取 → ② 仍然不對，按 Ctrl + Alt + B 記下這個畫面 → ③ 之後按下方「回報問題」。紅點的處理方法見 <button class="link" data-goto="help">設定 › 疑難排解</button></div>
  </section>
  <section class="card" aria-label="渴癮症助手設定">
    <h2>設定</h2>
    <div><div class="label">模式</div><div class="row" style="gap:8px">
      <button class="pill ${v.mode === "safe" ? "on" : ""}" data-cmd="set" data-key="mode" data-value="safe">原作者</button>
      <button class="pill ${v.mode === "mean" ? "on" : ""}" data-cmd="set" data-key="mode" data-value="mean">衝分</button>
    </div><div class="note" style="margin-top:8px">${v.mode === "mean" ? "彩箱機率差不多時，選平均分數較高的選項。" : "只追求戰前達 840k（彩箱）的機會。"}</div></div>
    <div><div class="label">實習生雪莉等級（手術用具可刷新 ${v.rerolls} 次）</div><div class="row" style="gap:8px">
      ${[1, 2, 3, 4, 5, 6].map((n) => `<button class="pill ${v.shelley === n ? "on" : ""}" data-cmd="set" data-key="shelley" data-value="${n}">${n}</button>`).join("")}
    </div></div>
    <div class="swrow">${sw(v.shown, "set", "shown", "顯示提示")}<span>顯示提示</span><span class="note">Ctrl + Alt + V</span></div>
    <div class="swrow">${sw(v.showRead, "set", "showRead", "顯示讀取結果")}<span>顯示讀取結果</span><span class="note">培養槽下方小框、卡一行、刷新次數</span></div>
    <div class="keys">
      <div class="kk">Ctrl + Alt + X</div><div>立即讀取一次畫面</div>
      <div class="kk">Ctrl + Alt + V</div><div>顯示或隱藏提示</div>
      <div class="kk">Ctrl + Alt + D</div><div>顯示或隱藏讀取結果</div>
      <div class="kk">Ctrl + Alt + B</div><div>記下讀錯的畫面（之後一併回報）</div>
      <div class="kk">Ctrl + Alt + Q</div><div>關閉工具箱</div>
    </div>
  </section>
  <div class="row" style="justify-content:space-between;gap:8px">
    <div class="note">${v.marked ? `已記下 ${v.marked} 個畫面` : ""}</div>
    <div class="row" style="gap:8px">
      <button class="btn" data-cmd="runs">打開對局紀錄</button>
      <button class="btn" data-confirm="resetStats">重設統計</button>
      <button class="btn goldline" data-cmd="report">回報問題</button>
    </div>
  </div>
  ${v.report ? `<div class="tip">已在桌面建立 <b>${esc(v.report.split("\\").pop())}</b>，並開啟了回報頁面：把這個 zip 拖進頁面，寫下發生了什麼即可。</div>` : ""}`;
}

function tartarus() {
  const t = S.tartarus;
  const head = (right) => `<div class="head"><div><h1>囚獸助手</h1><div class="sub">塔爾塔洛斯監獄：框出最佳一步與預計寶箱</div></div>${right || ""}</div>`;
  const err = t.error ? `<div class="tip" style="color:var(--text)">${dot("r")} ${esc(t.error)}</div>` : "";
  if (t.busy != null) {
    const pct = Math.round(t.busy * 100);
    return head() + `<section class="card"><div style="font-size:18px;font-weight:700">${t.installed ? "正在更新…" : "正在下載安裝…"} ${pct}%</div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="note">從 glcoder 的 GitHub 下載，完成後會自動啟動</div></section>`;
  }
  if (!t.installed) {
    return head() + err + `<section class="card" aria-label="安裝囚獸助手">
      <div style="font-size:18px;font-weight:700">尚未安裝</div>
      <p class="para">囚獸助手由 glcoder 開發（Tartarus Solver，MIT 授權）。工具箱會從它的 GitHub 下載最新版（約 36–93 MB，視電腦是否已有 .NET 9）。</p>
      <div class="row" style="gap:8px"><button class="btn gold big" data-cmd="tartarusInstall">安裝</button>
        <button class="btn big" data-cmd="tartarusChoose">已安裝？選擇位置</button></div></section>`;
  }
  const on = t.running || t.want;
  const st = t.stats;
  const per = st && st.runs ? (st.chromatic / st.runs).toFixed(2) : "—";
  const ver = t.version ? `v${esc(t.version)}` : "—";
  const upd = t.newer ? ` → <span style="color:var(--gold2)">v${esc(t.latest)} 可更新</span>` : (t.latest ? ` <span class="note">· 已是最新版本</span>` : "");
  return head(`<div class="row"><span class="badge ${on ? "run" : "stop"}">${t.running ? "執行中" : t.want ? "啟動中…" : "已停止"}</span>
      <button class="btn big ${on ? "" : "gold"}" data-cmd="tartarus" data-on="${!on}">${on ? "停止" : "啟動"}</button></div>`) + err + `
  <div class="stats">
    <div class="stat"><b>${st ? st.runs : "—"}</b><span>局數</span></div>
    <div class="stat"><b class="gold">${st ? st.chromatic : "—"}</b><span>彩色囚犯</span></div>
    <div class="stat"><b>${per}</b><span>每局平均</span></div>
  </div>
  <section class="card" aria-label="囚獸助手狀態">
    <div class="grid2">
      <div class="k">版本</div><div>${ver}${upd}</div>
      <div class="k">安裝位置</div><div class="path" style="margin:0;font-size:14px;color:var(--soft)">${esc(t.exe)}</div>
    </div>
    <div class="row" style="gap:8px">
      <button class="btn big ${t.shown ? "goldline" : ""}" data-cmd="tartarusShow" data-on="${!t.shown}" aria-pressed="${t.shown}" ${t.running ? "" : "disabled"}>${t.shown ? "收起設定" : "設定"}</button>
      ${t.newer ? `<button class="btn gold big" data-cmd="tartarusInstall">更新到 v${esc(t.latest)}</button>` : ""}
      <button class="btn small" data-cmd="tartarusChoose" style="margin-left:auto">更改位置…</button>
    </div>
    ${t.shown ? `<div class="note" style="color:var(--gold2)">已打開囚獸助手的設定視窗，再按一次「收起設定」收起。直接按它的 ✕ 會關閉它（工具箱會在幾秒後自動重新開啟）。</div>` : ""}
    ${t.running ? "" : `<div class="note">啟動後才能打開它的設定視窗。</div>`}
  </section>`;
}

function general() {
  const u = S.update;
  let upd;
  if (S.updating != null) {
    upd = `<div class="row" style="justify-content:space-between"><div>正在更新到 v${esc(u ? u.version : "")}… ${Math.round(S.updating * 100)}%</div></div>
           <div class="bar"><i style="width:${Math.round(S.updating * 100)}%"></i></div><div class="note">下載後會檢查檔案並重新啟動</div>`;
  } else if (u) {
    upd = `<div class="row" style="justify-content:space-between"><div>火炬工具箱 v${esc(S.version)} <span style="color:var(--gold2)">· 有新版本 v${esc(u.version)}</span></div>
             <button class="btn gold" data-cmd="update">立即更新</button></div>
           <div class="label" style="margin:0">更新內容</div><div class="notes">${esc(u.notes)}</div>`;
  } else {
    upd = `<div class="row" style="justify-content:space-between"><div>火炬工具箱 v${esc(S.version)} <span class="note">${S.upToDate ? "· 已是最新版本" : ""}</span></div>
             <button class="btn" data-cmd="checkUpdate">檢查更新</button></div>`;
  }
  return `
  <section class="card" aria-label="一般">
    <div class="swrow">${sw(S.boot, "set", "boot", "開機時自動啟動工具箱")}<span>開機時自動啟動工具箱</span><span class="note">縮在右下角，不會彈出視窗</span></div>
    <div class="swrow">${sw(S.autoGame, "set", "autoGame", "開遊戲時自動啟動工具，關遊戲時自動停止")}<span>開遊戲時自動啟動工具，關遊戲時自動停止</span></div>
    <p class="para sep">按視窗的 ✕ 只會縮到右下角，工具繼續執行。要完全關閉，請在右下角圖示按右鍵 →「結束」。</p>
    <div class="sep" style="display:flex;flex-direction:column;gap:12px">${upd}</div>
  </section>`;
}

function guide() {
  return `
  <section class="card" aria-label="教學">
    <div class="note" style="font-size:14px">第一次使用請完成以下幾步</div>
    <div class="step"><div class="num">1</div><div><b>在遊戲中開啟日誌</b><p>按 Esc →「帳號相關」→「開啟日誌」，然後登出再登入。</p></div></div>
    <div class="step"><div class="num">2</div><div><b>遊戲使用無邊框或視窗模式，解析度 2560×1440 或 3840×2160</b><p>提示要疊在遊戲上，獨佔全螢幕看不到。渴癮症助手目前只在這兩種解析度測試過，其他解析度（例如 1920×1080、21:9）可能讀不準。</p></div></div>
    <div class="step"><div class="num">3</div><div><b>選擇實習生雪莉等級</b><p>決定手術用具可以刷新幾次，設錯會影響建議。目前：${S.vorax.shelley} 級（可刷新 ${S.vorax.rerolls} 次）。</p>
      <div class="row" style="gap:8px;margin-top:10px">${[1, 2, 3, 4, 5, 6].map((n) => `<button class="pill ${S.vorax.shelley === n ? "on" : ""}" data-cmd="set" data-key="shelley" data-value="${n}">${n}</button>`).join("")}</div></div></div>
    <p class="para sep">之後只要開遊戲，提示框就會出現在遊戲畫面上，照著做即可。</p>
    ${S.firstRunDone ? "" : `<button class="btn gold big" style="align-self:flex-start" data-cmd="firstRunDone" data-then="vorax">完成，開始使用</button>`}
  </section>`;
}

function help() {
  const items = [
    ["找不到遊戲日誌", "先開啟遊戲。仍然找不到：確認已在遊戲中開啟日誌（Esc →「帳號相關」→「開啟日誌」，再登出登入），或在「渴癮症助手」頁按「選擇…」，選遊戲資料夾裡的 Game\\UE_game\\TorchLight\\Saved\\Logs\\UE_game.log。"],
    ["找到日誌，但遊戲沒有寫入", "遊戲尚未開啟日誌。按 Esc →「帳號相關」→「開啟日誌」，然後登出再登入，狀態就會變綠。"],
    ["解析度不在支援範圍", "渴癮症助手目前支援 2560×1440 與 3840×2160。其他解析度可能讀錯，建議改用其中一種；若想支援你的解析度，請用 Ctrl + Alt + B 記下畫面並回報問題。"],
    ["遊戲是獨佔全螢幕", "提示無法疊在獨佔全螢幕上。請在遊戲設定把顯示模式改為「無邊框」或「視窗」。"],
  ];
  return items.map(([t, b]) => `<div class="problem"><b>${dot("r")}${t}</b><p>${esc(b)}</p></div>`).join("");
}

function about() {
  return `
  <section class="card" aria-label="關於">
    <div><div style="font-size:18px;font-weight:700">火炬工具箱 v${esc(S.version)}</div>
      <p class="para" style="margin-top:6px">由 FakerPlay 製作。非官方工具，只讀取遊戲畫面與日誌，不會操作遊戲、不讀取記憶體。是否使用第三方工具請自行判斷。</p>
      <div class="row" style="gap:16px;margin-top:8px;font-size:14px">
        <a href="#" data-url="https://github.com/lauhinsnsd-dotcom/vorax-solver-rs-zh">GitHub</a>
        <a href="#" data-url="https://github.com/lauhinsnsd-dotcom/vorax-solver-rs-zh/issues/new/choose">回報問題</a></div></div>
    <div class="sep" style="display:flex;flex-direction:column;gap:12px;font-size:14px">
      <div class="note" style="font-size:14px">感謝以下作者（皆為 MIT 授權）</div>
      <div><b>渴癮症助手</b>：計算與讀取基於 DinoRaos 的 <a href="#" data-url="https://github.com/DinoRaos/vorax-solver-rs">vorax-solver-rs</a>；其前身為 tidewarden 的 Vorax Solver（2026-10-22 版）與 Moebing 的 <a href="#" data-url="https://github.com/Moebing/Torchlight-Infinite-SS11-Vorax-simulator">渴癮症模擬器</a>。中文支援與介面由 FakerPlay 製作。</div>
      <div><b>囚獸助手</b>：glcoder 的 <a href="#" data-url="https://github.com/glcoder/TartarusSolver">Tartarus Solver</a>，原樣使用，由工具箱下載與啟動。</div>
      <div class="note" style="font-size:14px">字型：Noto Sans TC／SC（SIL Open Font License 1.1）。授權全文見工具箱資料夾內的 LICENSE.txt 與 FONT-LICENSE.txt。</div>
    </div>
  </section>`;
}

function settings() {
  const tabs = [["general", "一般"], ["guide", "教學"], ["help", "疑難排解"], ["about", "關於"]];
  const body = { general, guide, help, about }[tab]();
  return `<h1>設定</h1>
    <div class="tabs" role="tablist">${tabs.map(([id, l]) => `<button class="tab ${tab === id ? "on" : ""}" role="tab" aria-selected="${tab === id}" data-tab="${id}">${l}</button>`).join("")}</div>
    ${body}`;
}

function convert(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) if (/[㐀-鿿]/.test(n.nodeValue) && !n.parentElement.closest("[data-noconv]")) n.nodeValue = toSc(n.nodeValue);
  for (const el of root.querySelectorAll("[aria-label],[title]")) {
    for (const a of ["aria-label", "title"]) if (el.hasAttribute(a)) el.setAttribute(a, toSc(el.getAttribute(a)));
  }
}

function render() {
  if (!S) return;
  const sc = S.script === "sc";
  document.body.classList.toggle("sc", sc);
  document.documentElement.lang = sc ? "zh-Hans" : "zh-Hant";
  nav();
  const main = document.getElementById("main");
  const top = main.scrollTop;
  main.innerHTML = page === "vorax" ? vorax() : page === "tartarus" ? tartarus() : settings();
  main.scrollTop = top;
  if (sc) { convert(document.querySelector("nav")); convert(main); document.title = toSc("火炬工具箱"); }
  else document.title = "火炬工具箱";
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.tagName === "A") e.preventDefault();
  if (t.dataset.page) { page = t.dataset.page; render(); document.getElementById("main").scrollTop = 0; return; }
  if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
  if (t.dataset.goto) { page = "settings"; tab = t.dataset.goto; render(); document.getElementById("main").scrollTop = 0; return; }
  if (t.dataset.url) { send({ cmd: "open", url: t.dataset.url }); return; }
  if (t.dataset.confirm) {
    const words = { resetStats: "重設統計？之前的局數不再計入（對局紀錄仍保留）。" }[t.dataset.confirm];
    if (confirm(S.script === "sc" ? toSc(words) : words)) send({ cmd: t.dataset.confirm });
    return;
  }
  const cmd = t.dataset.cmd;
  if (!cmd) return;
  if (cmd === "set") {
    let v = t.dataset.value;
    if (v === "true" || v === "false") v = v === "true";
    else if (/^\d+$/.test(v)) v = Number(v);
    send({ cmd, key: t.dataset.key, value: v });
  } else if (cmd === "vorax" || cmd === "tartarus" || cmd === "tartarusShow") {
    send({ cmd, on: t.dataset.on === "true" });
  } else {
    send({ cmd });
  }
  if (t.dataset.then) { page = t.dataset.then; render(); }
});

window.chrome && window.chrome.webview && window.chrome.webview.addEventListener("message", (e) => {
  const m = e.data;
  if (!m) return;
  if (m.type === "state") { S = m; render(); }
  else if (m.type === "tab") {
    const [p, t] = String(m.tab).split(":");
    page = p; if (t) tab = t; render();
  }
});

// the "seconds ago" and the game's state move on by themselves
setInterval(() => send({ cmd: "refresh" }), 3000);
send({ cmd: "ready" });
</script>
</body>
</html>
