<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>SmartTorch</title>
<style>
:root {
  --bg: #14161b; --side: #171920; --card: #1d2027; --card2: #23262e; --line: #2b2f38; --line2: #3a3f4a;
  --text: #ece9e2; --soft: #c9ccd3; --mute: #a3a7b0; --gold: #e3b25a; --gold2: #f3cd85; --goldbg: #3a3020;
  --green: #6fd39b; --greenbg: #1f3a2b; --green2: #8fe3b2; --red: #e86a5a; --grey: #5a5f6a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: "Microsoft JhengHei UI", "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif; font-size: 15px; user-select: none; }
body.sc { font-family: "Microsoft YaHei UI", "Microsoft JhengHei UI", "Segoe UI", system-ui, sans-serif; }
button { font-family: inherit; font-size: 15px; color: inherit; cursor: pointer; }
a { color: var(--gold); } a:hover { color: var(--gold2); }
.app { display: flex; height: 100%; }
nav { width: 240px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand b { font-size: 18px; display: block; }
.brand small { font-size: 12px; color: var(--mute); }
.navs { display: flex; flex-direction: column; gap: 4px; }
.nav { min-height: 46px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; border-radius: 8px; border: none; background: transparent; color: var(--soft); text-align: left; }
.nav:hover { background: #20232b; }
.nav.on { background: #2a2d36; color: var(--gold2); font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.g { background: var(--green); } .y { background: var(--gold); } .r { background: var(--red); } .n { background: var(--grey); }
.navfoot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 0 6px; }
.seg { display: flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; align-self: flex-start; }
.seg button { min-height: 36px; padding: 0 14px; border: none; background: transparent; color: var(--soft); font-size: 14px; }
.seg button.on { background: var(--goldbg); color: var(--gold2); font-weight: 700; }
main { flex: 1; min-width: 0; overflow-y: auto; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-size: 26px; }
h2 { margin: 0; font-size: 16px; color: var(--gold2); }
.sub { font-size: 14px; color: var(--mute); margin-top: 4px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { font-size: 13px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.badge.run { background: var(--greenbg); color: var(--green2); } .badge.stop { background: #2a2d36; color: #b4b8c0; }
.btn { min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; color: var(--text); font-size: 14px; }
.btn:hover { border-color: #565c69; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.big { min-height: 44px; padding: 0 20px; font-size: 15px; font-weight: 700; }
.btn.gold { border: none; background: var(--gold); color: #1a1408; font-weight: 700; }
.btn.goldline { border-color: var(--gold); background: var(--goldbg); color: var(--gold2); font-weight: 700; }
.btn.small { min-height: 34px; padding: 0 12px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.stat b { font-size: 24px; display: block; } .stat b.gold { color: var(--gold); }
.stat span { font-size: 13px; color: var(--mute); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.grid3 { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 12px; align-items: center; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 96px minmax(0, 1fr); column-gap: 12px; row-gap: 12px; font-size: 14px; }
.k { color: var(--mute); }
.v { display: flex; align-items: center; gap: 8px; min-width: 0; }
.path { font-size: 12px; color: var(--mute); margin-top: 4px; overflow-wrap: anywhere; user-select: text; }
.tip { background: var(--card2); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--soft); line-height: 1.8; }
.tip b { color: var(--gold2); }
.link { border: none; background: none; padding: 0; color: var(--gold); font-size: inherit; text-decoration: underline; }
.label { font-size: 13px; color: var(--mute); margin-bottom: 8px; }
.pill { min-height: 40px; min-width: 40px; padding: 0 14px; border-radius: 8px; font-size: 14px; border: 1px solid var(--line2); background: transparent; color: var(--soft); }
.pill.on { border-color: var(--gold); background: var(--goldbg); color: var(--gold2); font-weight: 700; }
.sw { width: 48px; height: 28px; border-radius: 999px; border: none; padding: 3px; display: flex; flex-shrink: 0; justify-content: flex-start; background: var(--line2); }
.sw.on { justify-content: flex-end; background: var(--gold); }
.sw i { width: 22px; height: 22px; border-radius: 50%; background: var(--bg); display: block; }
.swrow { display: flex; align-items: center; gap: 12px; font-size: 14px; flex-wrap: wrap; }
.note { color: var(--mute); font-size: 13px; }
.keys { display: grid; grid-template-columns: 140px minmax(0, 1fr); row-gap: 6px; font-size: 13px; color: var(--soft); border-top: 1px solid var(--line); padding-top: 14px; }
.keys .kk { color: var(--text); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.tab { min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--soft); font-size: 14px; }
.tab.on { border-color: var(--gold); background: var(--goldbg); color: var(--gold2); font-weight: 700; }
.step { display: flex; gap: 14px; }
.num { width: 30px; height: 30px; border-radius: 50%; background: var(--goldbg); color: var(--gold2); font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step b { font-size: 15px; } .step p { margin: 4px 0 0; font-size: 14px; color: var(--soft); line-height: 1.7; }
.problem { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; }
.problem b { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.problem p { margin: 0; font-size: 14px; color: var(--soft); line-height: 1.7; }
.para { font-size: 14px; color: var(--soft); line-height: 1.7; margin: 0; }
.sep { border-top: 1px solid var(--line); padding-top: 16px; }
.notes { white-space: pre-wrap; font-size: 13px; color: var(--soft); line-height: 1.7; background: var(--card2); border-radius: 10px; padding: 12px 14px; max-height: 260px; overflow-y: auto; user-select: text; }
.bar { height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); }
.newdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block; }
.cform { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 10px; align-items: end; }
.cform label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mute); }
input.tx { min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card2); color: var(--text); font-family: inherit; font-size: 14px; user-select: text; min-width: 0; width: 100%; }
input.tx:focus { outline: none; border-color: var(--gold); }
input.mono, .ccode { font-family: Consolas, "Cascadia Mono", monospace; }
.clist { display: flex; flex-direction: column; gap: 8px; }
.crow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.crow.drag { opacity: .4; } .crow.over { border-color: var(--gold); }
.grip { color: var(--grey); cursor: grab; font-size: 18px; text-align: center; letter-spacing: -3px; }
.cname { font-weight: 700; overflow-wrap: anywhere; user-select: text; }
.ccode { font-size: 13px; color: var(--soft); margin-top: 4px; overflow-wrap: anywhere; user-select: text; }
.cedit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px; }
.btn.ok { border-color: var(--green); color: var(--green2); }
@media (max-width: 760px) { nav { width: 190px; } main { padding: 24px; } }
</style>
</head>
<body>
<div class="app">
  <nav aria-label="主選單">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="logo" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e05a24"/><stop offset="1" stop-color="#ffcf6b"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="#1b1e25"/><path d="M32 6 C40 16 50 22 50 36 C50 47 42 56 32 56 C22 56 14 47 14 36 C14 27 20 22 23 15 C25 22 28 24 31 24 C28 18 29 11 32 6 Z" fill="url(#logo)"/><path d="M38.5 31.5 C37 29 34.5 28 32 28 C28.5 28 26 30 26 33 C26 39 38.5 37 38.5 43.5 C38.5 46.5 35.5 48.5 32 48.5 C29 48.5 26.5 47 25 44.5" fill="none" stroke="#1b1e25" stroke-width="5" stroke-linecap="round"/></svg>
      <div><b>SmartTorch</b><small>by 肥可</small></div>
    </div>
    <div class="navs" id="navs"></div>
    <div class="navfoot" id="navfoot"></div>
  </nav>
  <main id="main"></main>
</div>
<script>
"use strict";
// Traditional → Simplified, character by character (OpenCC, made by dev/make_ui_t2s.py), after the words that
// Simplified writes differently
const T2S = /*T2S*/{};
const PHRASES = [
  ["解析度", "分辨率"], ["視窗", "窗口"], ["設定", "设置"], ["資料夾", "文件夹"], ["檔案", "文件"], ["記錄檔", "日志文件"],
  ["預設", "默认"], ["螢幕", "屏幕"], ["回報", "反馈"], ["程式", "程序"], ["支援", "支持"], ["連結", "链接"], ["資訊", "信息"],
  ["工作列", "任务栏"], ["圖示", "图标"], ["滑鼠", "鼠标"], ["文字辨識", "文字识别"], ["全螢幕", "全屏"], ["獨佔", "独占"], ["下載", "下载"]
];
function toSc(t) {
  for (const [a, b] of PHRASES) t = t.split(a).join(b);
  let out = "";
  for (const c of t) out += T2S[c] || c;
  return out;
}

let S = null;           // the state, from SmartTorch
let page = "vorax";     // vorax | tartarus | etor | codes | settings
let CODES = null;       // 流派碼: [{name, code}], from SmartTorch's codes.json; saved whole after each change
let editing = -1;       // the code being changed, or -1
let drawn = "";         // the 流派碼 page as drawn (page and language): not drawn again while it's open, so typing isn't lost
let tab = "general";    // the settings' tab
const send = (o) => window.chrome && window.chrome.webview && window.chrome.webview.postMessage(o);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const en = () => S && S.lang === "en";
// the words in the interface's language: Chinese (Traditional; turned into Simplified after drawing) or English
const L = (zh, english) => (en() ? english : zh);
// a note in brackets, as each language writes them
const P = (x) => (en() ? ` (${x})` : `（${x}）`);
const sw = (on, cmd, key, label) => `<button class="sw ${on ? "on" : ""}" aria-pressed="${on}" aria-label="${esc(label)}" data-cmd="${cmd}" data-key="${key}" data-value="${!on}"><i></i></button>`;
const dot = (c) => `<span class="dot ${c}"></span>`;
const REPO = "https://github.com/lauhinsnsd-dotcom/SmartTorch";

function nav() {
  const v = S ? S.vorax : null;
  const t = S && S.tartarus;
  const items = [
    ["vorax", L("渴癮症助手", "Vorax helper"), v ? (v.running ? "g" : "n") : ""],
    ["tartarus", L("囚獸助手", "Tartarus helper"), t && t.installed ? (t.running ? "g" : "n") : ""],
    ["etor", L("易火", "ETor"), S && S.etor && S.etor.exe ? (S.etor.running ? "g" : "n") : ""],
    ["codes", L("流派碼", "Build codes"), ""],
    ["settings", L("設定", "Settings"), S && S.update ? "newdot" : ""],
  ];
  document.getElementById("navs").innerHTML = items.map(([id, label, d]) =>
    `<button class="nav ${page === id ? "on" : ""}" data-page="${id}" aria-current="${page === id ? "page" : "false"}"><span>${label}</span>${d === "newdot" ? `<span class="newdot" title="${L("有新版本", "Update available")}"></span>` : d ? dot(d) : ""}</button>`).join("");
  const game = v && v.game.open;
  const lang = S ? S.lang : "tc";
  const opt = (id, label) => `<button class="${lang === id ? "on" : ""}" aria-pressed="${lang === id}" data-cmd="set" data-key="lang" data-value="${id}">${label}</button>`;
  document.getElementById("navfoot").innerHTML =
    `<div class="row" style="font-size:13px;color:var(--soft);gap:8px">${dot(game ? "g" : "n")}${game ? L("遊戲已開啟", "Game is open") : L("遊戲未開啟", "Game not open")}</div>
     <div class="note" style="font-size:12px;line-height:1.6">${L("完全免費 · 官方下載只有", "Free · only official download:")} <a href="#" data-url="${REPO}/releases">GitHub</a></div>
     <div class="seg" role="group" aria-label="Language" data-noconv>${opt("tc", "繁體")}${opt("sc", "简体")}${opt("en", "EN")}</div>`;
}

function ago(s) {
  if (en()) return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ago`;
  if (s < 60) return `${s} 秒前`;
  if (s < 3600) return `${Math.floor(s / 60)} 分鐘前`;
  return `${Math.floor(s / 3600)} 小時前`;
}

function ocrName(l) {
  if (/^zh-(Hant|TW|HK|MO)/i.test(l)) return L("中文（繁體）", "Chinese (Traditional)");
  if (/^zh/i.test(l)) return L("中文（簡體）", "Chinese (Simplified)");
  if (/^en/i.test(l)) return L("英文", "English");
  return l;
}

function vorax() {
  const v = S.vorax;
  // a Chinese client is read at 2560×1440 and 3840×2160 only (tested); an English one as upstream reads it, at any size
  const chinese = typeof v.ocr === "string" && /^zh/i.test(v.ocr);
  const supported = (w, h) => !chinese || (w === 2560 && h === 1440) || (w === 3840 && h === 2160);
  let gameRow;
  if (!v.game.open) gameRow = `${dot("n")}${L("未開啟遊戲", "The game isn't open")}`;
  else if (v.game.fullScreen) gameRow = `${dot("r")}${L("遊戲是獨佔全螢幕：請改為無邊框或視窗", "The game is in exclusive full screen: switch to borderless or windowed")} <button class="link" data-goto="help">${L("怎麼做", "How")}</button>`;
  else if (v.game.w && !supported(v.game.w, v.game.h)) gameRow = `${dot("y")}${L("已連接", "Connected")}${P(`${v.game.w}×${v.game.h}`)}${L("：此解析度未測試，可能讀不準", ": this resolution isn't tested with the Chinese client and may be misread")}`;
  else gameRow = `${dot("g")}${L("已連接", "Connected")}${v.game.w ? P(`${v.game.w}×${v.game.h}`) : ""}`;
  const lg = v.log;
  const logText = {
    on: [dot("g"), L("已開啟", "On")], checking: [dot("y"), L("檢查中…", "Checking…")], nogame: [dot("n"), L("等待遊戲開啟", "Waiting for the game")],
    off: [dot("r"), L("遊戲沒有寫入日誌：請在遊戲中開啟日誌", "The game isn't writing its log: turn it on in the game")], missing: [dot("r"), L("找不到遊戲日誌", "Game log not found")],
  }[lg.state] || [dot("n"), "—"];
  const how = lg.path ? (lg.manual ? L("（手動選擇）", " (chosen)") : L("（自動找到）", " (found)")) : "";
  const fix = (lg.state === "off" || lg.state === "missing") ? ` <button class="link" data-goto="help">${L("怎麼辦", "What to do")}</button>` : "";
  const ocr = v.ocr === null ? `${dot("n")}${L("檢查中…", "Checking…")}` : v.ocr === false ? `${dot("r")}${L("未安裝：只能用卡面圖案辨認", "Not installed: cards are told by their pictures only")}` : `${dot("g")}${ocrName(v.ocr)}${L("已安裝", " installed")}`;
  const last = v.last ? `${dot(v.last.warn ? "y" : "g")}${esc(v.last.text)}${P(ago(v.last.ago))}` : `${dot("n")}${L("尚未讀取", "Nothing read yet")}`;
  const st = v.stats;
  const modeName = v.mode === "mean" ? L("衝分", "push score") : L("原作者", "upstream's");
  const mean = st.games ? (en() ? Math.round(st.mean * 10) + "k" : st.mean.toFixed(1) + " 萬") : "—";
  return `
  <div class="head">
    <div><h1>${L("渴癮症助手", "Vorax helper")}</h1><div class="sub">${L("手術準備：建議下一步，培養槽下方標示讀取結果", "Surgical Preparation: the next move, with what was read under each tank")}</div></div>
    <div class="row"><span class="badge ${v.running ? "run" : "stop"}">${v.running ? L("執行中", "Running") : L("已停止", "Stopped")}</span>
      <button class="btn big ${v.running ? "" : "gold"}" data-cmd="vorax" data-on="${!v.running}">${v.running ? L("停止", "Stop") : L("啟動", "Start")}</button></div>
  </div>
  <div class="stats">
    <div class="stat"><b>${st.games}</b><span>${L("打完的局", "Runs played")}${P(modeName)}</span></div>
    <div class="stat"><b class="gold">${st.rainbow}</b><span>${L("彩箱局數", "Reached 840k")}</span></div>
    <div class="stat"><b>${mean}</b><span>${L("平均分數", "Mean score")}</span></div>
  </div>
  <div class="row" style="justify-content:flex-end;gap:8px;margin-top:-8px">
    <button class="btn" data-cmd="runs">${L("打開對局紀錄", "Your runs")}</button>
    <button class="btn" data-confirm="clearRecords">${L("清除紀錄", "Clear records")}</button>
  </div>
  <section class="card" aria-label="${L("連接狀態", "Connection")}">
    <h2>${L("連接狀態", "Connection")}</h2>
    <div class="grid3">
      <div class="k">${L("遊戲視窗", "Game window")}</div><div class="v">${gameRow}</div><div></div>
      <div class="k">${L("遊戲日誌", "Game log")}</div>
      <div style="min-width:0"><div class="v">${logText[0]}${logText[1]}${how}${fix}</div>${lg.path ? `<div class="path">${esc(lg.path)}</div>` : ""}</div>
      <div class="row" style="gap:6px"><button class="btn small" data-cmd="chooseLog">${L("選擇…", "Choose…")}</button><button class="btn small" data-cmd="autoLog">${L("自動", "Auto")}</button></div>
      <div class="k">${L("文字辨識", "Text reading")}</div><div class="v">${ocr}</div><div></div>
      <div class="k">${L("最後讀取", "Last read")}</div><div class="v">${last}</div><div></div>
    </div>
    <div class="tip"><b>${L("讀不到或讀錯？", "Not read, or misread?")}</b> ${L("① 按 Ctrl + Alt + X 重新讀取 → ② 仍然不對，按 Ctrl + Alt + B 記下這個畫面 → ③ 之後按下方「回報問題」。紅點的處理方法見", "① Press Ctrl + Alt + X to read again → ② still wrong: Ctrl + Alt + B sets the picture aside → ③ later, press Report a problem below. For a red dot, see")} <button class="link" data-goto="help">${L("設定 › 疑難排解", "Settings › Troubleshooting")}</button></div>
    <div class="row" style="justify-content:space-between;gap:8px">
      <div class="row" style="gap:8px">${v.marked ? `<span class="note">${L(`已記下 ${v.marked} 個畫面`, `${v.marked} picture${v.marked > 1 ? "s" : ""} set aside`)}</span>
        <button class="btn small" data-cmd="markedOpen">${L("開啟資料夾", "Open folder")}</button>
        <button class="btn small" data-confirm="markedClear">${L("清除", "Clear")}</button>` : `<span class="note">${L("尚未記下畫面", "No pictures set aside")}</span>`}</div>
      <button class="btn goldline" data-cmd="report">${L("回報問題", "Report a problem")}</button>
    </div>
    ${v.report ? `<div class="tip">${L("已在桌面建立", "Made on the desktop:")} <b>${esc(v.report.split("\\").pop())}</b>${L("，並在瀏覽器開啟了回報頁面：把這個 zip 拖進頁面的「回報檔」欄，寫下發生了什麼即可（需要登入 GitHub）。", ", and the report page is open in the browser: drag the zip into its 回報檔 (report file) box and say what happened (a GitHub account is needed).")}</div>` : ""}
  </section>
  <section class="card" aria-label="${L("渴癮症助手設定", "Vorax helper settings")}">
    <h2>${L("設定", "Settings")}</h2>

function tartarus() {
  const t = S.tartarus;
  const head = (right) => `<div class="head"><div><h1>${L("囚獸助手", "Tartarus helper")}</h1><div class="sub">${L("塔爾塔洛斯監獄：框出最佳一步與預計寶箱", "Tartarus Prison: the best move framed, with the chests it leads to")}</div></div>${right || ""}</div>`;
  const err = t.error ? `<div class="tip" style="color:var(--text)">${dot("r")} ${esc(t.error)}</div>` : "";
  if (!t.installed) {
    return head() + err + `<section class="card" aria-label="${L("找不到囚獸助手", "Tartarus Solver not found")}">
      <div style="font-size:18px;font-weight:700">${L("尚未找到囚獸助手", "Tartarus Solver not found yet")}</div>
      <p class="para">${L("囚獸助手是 glcoder 開發的 Tartarus Solver（MIT 授權），請到它的 GitHub 下載：", "The Tartarus helper is glcoder's Tartarus Solver (MIT licence). Download it from its GitHub:")}</p>
      <div class="step"><div class="num">1</div><div><p style="margin:0">${L("按「前往下載頁」，下載 <b>TartarusSolver-版本-full.zip</b>（電腦已裝 .NET 9 可選較小的另一個）。", "Press Download page and get <b>TartarusSolver-version-full.zip</b> (with .NET 9 installed, the smaller one will do).")}</p></div></div>
      <div class="step"><div class="num">2</div><div><p style="margin:0">${L("解壓到任何資料夾，開啟一次裡面的 TartarusSolver.exe，SmartTorch 會自動找到它；或按「選擇位置」指定。", "Unpack it anywhere and run its TartarusSolver.exe once: SmartTorch finds it. Or press Choose its place.")}</p></div></div>
      <div class="row" style="gap:8px"><button class="btn gold big" data-cmd="tartarusDownload">${L("前往下載頁", "Download page")}</button>
        <button class="btn big" data-cmd="tartarusChoose">${L("選擇位置", "Choose its place")}</button></div></section>`;
  }
  const on = t.running || t.want;
  const st = t.stats;
  const per = st && st.runs ? (st.chromatic / st.runs).toFixed(2) : "—";
  const ver = t.version ? `v${esc(t.version)}` : "—";
  const upd = t.newer ? ` → <span style="color:var(--gold2)">v${esc(t.latest)} ${L("可更新", "is out")}</span>` : (t.latest ? ` <span class="note">· ${L("已是最新版本", "the latest")}</span>` : "");
  return head(`<div class="row"><span class="badge ${on ? "run" : "stop"}">${t.running ? L("執行中", "Running") : t.want ? L("啟動中…", "Starting…") : L("已停止", "Stopped")}</span>
      <button class="btn big ${on ? "" : "gold"}" data-cmd="tartarus" data-on="${!on}">${on ? L("停止", "Stop") : L("啟動", "Start")}</button></div>`) + err + `
  <div class="stats">
    <div class="stat"><b>${st ? st.runs : "—"}</b><span>${L("局數", "Runs")}</span></div>
    <div class="stat"><b class="gold">${st ? st.chromatic : "—"}</b><span>${L("彩色囚犯", "Chromatic Inmates")}</span></div>
    <div class="stat"><b>${per}</b><span>${L("每局平均", "Per run")}</span></div>
  </div>
  <div class="row" style="justify-content:flex-end;margin-top:-8px"><button class="btn" data-confirm="tartarusReset">${L("重設統計", "Reset statistics")}</button></div>
  <section class="card" aria-label="${L("囚獸助手狀態", "Tartarus helper")}">
    <div class="grid2">
      <div class="k">${L("版本", "Version")}</div><div>${ver}${upd}</div>
      <div class="k">${L("安裝位置", "Installed at")}</div><div class="path" style="margin:0;font-size:14px;color:var(--soft)">${esc(t.exe)}</div>
    </div>
    <div class="row" style="gap:8px">
      <button class="btn big ${t.shown ? "goldline" : ""}" data-cmd="tartarusShow" data-on="${!t.shown}" aria-pressed="${t.shown}" ${t.running ? "" : "disabled"}>${t.shown ? L("收起設定", "Hide settings") : L("設定", "Settings")}</button>
      ${t.newer && t.running ? `<button class="btn gold big" data-cmd="tartarusShow" data-on="true">${L("更新到", "Update to")} v${esc(t.latest)}</button>` : ""}
      <button class="btn small" data-cmd="tartarusChoose" style="margin-left:auto">${L("更改位置…", "Change place…")}</button>
    </div>
    ${t.shown ? `<div class="note" style="color:var(--gold2)">${L("已打開囚獸助手的設定視窗，再按一次「收起設定」收起。直接按它的 ✕ 會關閉它（SmartTorch 會在幾秒後自動重新開啟）。", "Its window is open: press Hide settings to put it away. Its own ✕ closes it (SmartTorch starts it again a few seconds later).")}</div>` : ""}
    ${t.newer && t.shown ? `<div class="note" style="color:var(--gold2)">${L(`在它的視窗右下方按「Update to ${esc(t.latest)}」，它會自己更新並重新開啟。`, `Press "Update to ${esc(t.latest)}" at the bottom right of its window: it updates itself and starts again.`)}</div>` : ""}
    ${t.running ? "" : `<div class="note">${L("啟動後才能打開它的設定視窗。", "Start it to open its settings.")}</div>`}
  </section>`;
}

  return `

  const list = CODES == null ? `<div class="note">${L("載入中…", "Loading…")}</div>`
    : CODES.length ? CODES.map(codeRow).join("")
    : `<div class="tip">${L("還沒有流派碼。在上面填入名字和流派碼，按「儲存」。", "No codes yet. Fill in a name and a code above, then Save.")}</div>`;
  return `
  <div><h1>${L("流派碼", "Build codes")}</h1><div class="sub">${L("儲存自己常用的流派碼，按「複製」後到遊戲裡貼上。", "Keep the build codes you use: Copy, then paste it in the game.")}</div></div>
  <section class="card" aria-label="${L("新增", "Add")}">
    <div class="cform">
      <label>${L("名字", "Name")}<input class="tx" id="cn"></label>
      <label>${L("流派碼", "Code")}<input class="tx mono" id="cc" placeholder="${L("貼上流派碼", "Paste the code")}" spellcheck="false"></label>
      <button class="btn gold" data-code="add">${L("儲存", "Save")}</button>
    </div>
  </section>
  <div class="clist" id="clist">${list}</div>
  ${CODES && CODES.length > 1 ? `<div class="note">${L("按住左邊的 ⋮⋮ 拖動可以排序。", "Drag ⋮⋮ on the left to reorder.")}</div>` : ""}`;
}

// the page puts the code on the clipboard itself (the button's click lets it), as any web page's Copy does
function copyText(text) {
  const t = document.createElement("textarea");
  t.value = text;
  t.setAttribute("readonly", "");
  t.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;user-select:text";
  document.body.appendChild(t);
  t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
  t.remove();
  if (!ok && navigator.clipboard) { navigator.clipboard.writeText(text).then(() => copied(-1, true)).catch(() => {}); }
  return ok;
}
let copyTimer = null;
// the Copy button says so for a second
function copied(i, ok) {
  const tc = (x) => (S && S.lang === "sc" ? toSc(x) : x);
  const b = i >= 0 ? document.getElementById("cp" + i) : document.querySelector("[data-copying]");
  if (!b) return;
  document.querySelectorAll("[data-copying]").forEach((x) => x.removeAttribute("data-copying"));
  if (!ok) b.setAttribute("data-copying", "");
  b.textContent = tc(ok ? L("已複製 ✓", "Copied ✓") : L("複製失敗", "Not copied"));
  b.classList.toggle("ok", ok);
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { b.textContent = tc(L("複製", "Copy")); b.classList.remove("ok"); }, 1000);
}

function saveCodes() { send({ cmd: "codesSave", list: CODES }); }
// the list drawn again (after a change), the form's typing kept
function drawCodes() { drawn = ""; render(); }

function settings() {
  const tabs = [["general", L("一般", "General")], ["guide", L("教學", "Getting started")], ["help", L("疑難排解", "Troubleshooting")], ["about", L("關於", "About")]];
  const body = { general, guide, help, about }[tab]();
  return `<h1>${L("設定", "Settings")}</h1>
    <div class="tabs" role="tablist">${tabs.map(([id, l]) => `<button class="tab ${tab === id ? "on" : ""}" role="tab" aria-selected="${tab === id}" data-tab="${id}">${l}</button>`).join("")}</div>
    ${body}`;
}

function convert(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) if (/[\u3400-\u9fff]/.test(n.nodeValue) && !n.parentElement.closest("[data-noconv]")) n.nodeValue = toSc(n.nodeValue);
  for (const el of root.querySelectorAll("[aria-label],[title],[placeholder]")) {
    for (const a of ["aria-label", "title", "placeholder"]) if (el.hasAttribute(a)) el.setAttribute(a, toSc(el.getAttribute(a)));
  }
}

function render() {
  if (!S) return;
  const sc = S.lang === "sc";
  document.body.classList.toggle("sc", sc);
  document.documentElement.lang = en() ? "en" : sc ? "zh-Hans" : "zh-Hant";
  nav();
  if (sc) convert(document.querySelector("nav"));
  const main = document.getElementById("main");
  // the 流派碼 page isn't drawn again by the state that comes every few seconds: what's typed stays
  const key = page + ":" + S.lang;
  if (page === "codes" && drawn === key) return;
  drawn = page === "codes" ? key : "";
  const keep = page === "codes" ? ["cn", "cc"].map((id) => { const e = document.getElementById(id); return e ? e.value : ""; }) : null;
  const top = main.scrollTop;
  main.innerHTML = page === "vorax" ? vorax() : page === "tartarus" ? tartarus() : page === "codes" ? codes() : page === "etor" ? etor() : settings();
  main.scrollTop = top;
  if (keep) ["cn", "cc"].forEach((id, k) => { const e = document.getElementById(id); if (e) e.value = keep[k]; });
  if (sc) convert(main);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.tagName === "A") e.preventDefault();
  if (t.dataset.page) { page = t.dataset.page; render(); document.getElementById("main").scrollTop = 0; return; }
  if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
  if (t.dataset.goto) { page = "settings"; tab = t.dataset.goto; render(); document.getElementById("main").scrollTop = 0; return; }
  if (t.dataset.url) { send({ cmd: "open", url: t.dataset.url }); return; }
  if (t.dataset.code) { codeAction(t.dataset.code, Number(t.dataset.i)); return; }
  if (t.dataset.confirm) {
    const words = {
      clearRecords: L("清除紀錄？對局紀錄、統計、記錄檔和記下的畫面都會刪除，之後從零開始。（有問題要回報的話，請先按「回報問題」再清除。）", "Clear records? Your runs, the statistics, the log and the pictures set aside are deleted, and it starts from zero. (Report a problem first if you have one.)"),
      markedClear: L("清除記下的畫面？（回報問題後會自動清除，平常不必手動清除）", "Throw away the pictures set aside? (Reporting a problem clears them by itself.)"),
      tartarusReset: L("重設囚獸助手的統計？SmartTorch 之後只計算從現在開始的局數（囚獸助手自己的紀錄不會改動）。", "Reset the Tartarus statistics? SmartTorch counts from now on (Tartarus Solver's own record isn't touched)."),
    }[t.dataset.confirm];
    if (confirm(S.lang === "sc" ? toSc(words) : words)) send({ cmd: t.dataset.confirm });
    return;
  }
  const cmd = t.dataset.cmd;
  if (!cmd) return;
  if (cmd === "set") {
    let v = t.dataset.value;
    if (v === "true" || v === "false") v = v === "true";
    else if (/^\d+$/.test(v)) v = Number(v);
    send({ cmd, key: t.dataset.key, value: v });
  } else if (cmd === "vorax" || cmd === "tartarus" || cmd === "tartarusShow") {
    send({ cmd, on: t.dataset.on === "true" });
  } else {
    send({ cmd });
  }
  if (t.dataset.then) { page = t.dataset.then; render(); }
});

function codeAction(act, i) {
  if (!CODES) return;
  const val = (id) => (document.getElementById(id) ? document.getElementById(id).value.trim() : "");
  if (act === "add") {
    const name = val("cn"), code = val("cc");
    if (!code) { const e = document.getElementById("cc"); if (e) e.focus(); return; }
    CODES.unshift({ name, code });
    saveCodes();
    document.getElementById("cn").value = "";
    document.getElementById("cc").value = "";
    editing = -1;
    drawCodes();
    document.getElementById("cn").focus();
  } else if (act === "copy") {
    copied(i, copyText(CODES[i].code));
  } else if (act === "edit") {
    editing = i; drawCodes();
    const e = document.getElementById("en" + i); if (e) e.focus();
  } else if (act === "cancel") {
    editing = -1; drawCodes();
  } else if (act === "saveEdit") {
    const code = val("ec" + i);
    if (!code) return;
    CODES[i] = { name: val("en" + i), code };
    editing = -1; saveCodes(); drawCodes();
  } else if (act === "del") {
    const words = L(`刪除「${CODES[i].name || CODES[i].code}」？`, `Delete "${CODES[i].name || CODES[i].code}"?`);
    if (!confirm(S.lang === "sc" ? toSc(words) : words)) return;
    CODES.splice(i, 1);
    if (editing === i) editing = -1; else if (editing > i) editing--;
    saveCodes(); drawCodes();
  }
}

// Enter saves (in the form, or the code being changed)
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || page !== "codes" || !e.target.matches("input.tx")) return;
  e.preventDefault();
  if (e.target.id === "cn" || e.target.id === "cc") codeAction("add");
  else if (editing >= 0) codeAction("saveEdit", editing);
});

// 流派碼 reordered by dragging
let dragFrom = -1;
document.addEventListener("dragstart", (e) => {
  const r = e.target.closest && e.target.closest(".crow[draggable]");
  if (!r || editing >= 0) { e.preventDefault(); return; }
  dragFrom = Number(r.dataset.i);
  r.classList.add("drag");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", "");
});
document.addEventListener("dragover", (e) => {
  const r = dragFrom >= 0 && e.target.closest && e.target.closest(".crow");
  if (!r) return;
  e.preventDefault();
  document.querySelectorAll(".crow.over").forEach((x) => x !== r && x.classList.remove("over"));
  r.classList.add("over");
});
document.addEventListener("drop", (e) => {
  const r = dragFrom >= 0 && e.target.closest && e.target.closest(".crow");
  if (!r) return;
  e.preventDefault();
  const to = Number(r.dataset.i);
  if (to !== dragFrom) {
    const [c] = CODES.splice(dragFrom, 1);
    CODES.splice(to, 0, c);
    saveCodes();
  }
  dragFrom = -1;
  drawCodes();
});
document.addEventListener("dragend", () => {
  if (dragFrom < 0) return;
  dragFrom = -1;
  document.querySelectorAll(".crow.drag, .crow.over").forEach((x) => x.classList.remove("drag", "over"));
});

window.chrome && window.chrome.webview && window.chrome.webview.addEventListener("message", (e) => {
  const m = e.data;
  if (!m) return;
  if (m.type === "state") { S = m; render(); }
  else if (m.type === "codes") { CODES = Array.isArray(m.list) ? m.list : []; if (page === "codes") drawCodes(); }

  else if (m.type === "tab") {
    const [p, t] = String(m.tab).split(":");
    page = p; if (t) tab = t; render();
  }
});

// the "seconds ago" and the game's state move on by themselves
setInterval(() => send({ cmd: "refresh" }), 3000);
send({ cmd: "ready" });
send({ cmd: "codesGet" });
</script>
</body>
</html>
